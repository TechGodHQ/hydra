name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/ts-client/package-lock.json

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check example generated artifacts
        run: |
          cd examples/notes && cargo run -p hydra-codegen --bin hydra-codegen -- check
          cd ../security-scan && cargo run -p hydra-codegen --bin hydra-codegen -- check

      - name: Typecheck TypeScript client example
        run: |
          npm ci --prefix examples/ts-client
          npm run typecheck --prefix examples/ts-client
          npm run test:nested-schema --prefix examples/ts-client

  creed:
    name: Creed context drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install creed
        run: go install github.com/techgodhq/creed@v0.4.1

      - name: Emitted agent context must match .creed source
        run: creed diff
