# Hydra generation config for the notes example.
# Generated code is include!()'d into this crate, so dispatch and state use
# crate-local paths.
http_dispatch_fn: "crate::execute_operation_http"
http_state_type: "crate::AppState"
# Raw-request operations (raw_request: true) dispatch here instead.
http_raw_dispatch_fn: "crate::execute_operation_raw_http"
sse_binding_prefix: "super::"
