operations:
  - name: list_notes
    description: List notes, newest first.
    method: GET
    path: /notes
    read: true
    output_type: Vec<Note>
    parameters:
      - name: limit
        description: Maximum number of notes to return.
        type: u32
        required: false
        location: query
  - name: get_note
    description: Get a single note by ID.
    method: GET
    path: /notes/{note_id}
    read: true
    output_type: Note
    parameters:
      - name: note_id
        description: Note ID to fetch.
        type: string
        required: true
        location: path
  - name: create_note
    description: Create a note with a title and body.
    method: POST
    path: /notes
    read: false
    output_type: Note
    parameters:
      - name: title
        description: Note title.
        type: string
        required: true
        location: body
      - name: body
        description: Note body text.
        type: string
        required: true
        location: body
  - name: delete_note
    description: Delete a note by ID.
    method: POST
    path: /notes/{note_id}/delete
    read: false
    output_type: "()" 
    parameters:
      - name: note_id
        description: Note ID to delete.
        type: string
        required: true
        location: path
  - name: note_stats
    description: Return total note count and character volume.
    method: GET
    path: /stats
    read: true
    output_type: Stats
    parameters: []
    surfaces: [http, mcp]
  - name: compact_notes
    description: Internal compaction job; exposed on CLI only for operators.
    method: POST
    path: /internal/compact
    read: false
    output_type: "()"
    parameters: []
    surfaces: [cli]
  - name: echo_raw
    description: Echo the exact raw request bytes and headers; webhook-style ingress reference.
    method: POST
    path: /hooks/echo
    read: false
    output_type: Value
    parameters: []
    surfaces: [http]
    raw_request: true
  - name: annotate_note
    description: Append an annotation to a note, optionally carrying attachments.
    method: POST
    path: /notes/{note_id}/annotate
    read: false
    output_type: Value
    parameters:
      - name: note_id
        description: Note ID to annotate.
        type: string
        required: true
        location: path
      - name: body
        description: Annotation text.
        type: string
        required: true
        location: body
      - name: attachments
        description: Attachments to attach; each is inline bytes or a stored reference.
        type: json
        required: false
        location: body
        schema:
          type: array
          items:
            oneOf:
              - type: object
                properties:
                  mime_type:
                    type: string
                  filename:
                    type: string
                  data_base64:
                    type: string
                required: [mime_type, data_base64]
                additionalProperties: false
              - type: object
                properties:
                  stored_id:
                    type: string
                required: [stored_id]
                additionalProperties: false
        cli:
          flag: attach
          multiple: true
          companions:
            - flag: attach-mime
              field: attach_mime
              description: MIME type for the corresponding local-path --attach value.
