[workspace]
resolver = "2"
members = [
    "crates/hydra-core",
    "crates/hydra-mcp-stdio",
    "crates/hydra-codegen",
    "examples/notes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/TechGodHQ/hydra"
homepage = "https://github.com/TechGodHQ/hydra"
description = "One API definition, many surfaces: CLI, HTTP, and MCP generated from a single source of truth"
authors = ["TechGodHQ"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
hydra-core = { path = "crates/hydra-core" }
hydra-mcp-stdio = { path = "crates/hydra-mcp-stdio" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"

[profile.dev]
debug = 0
